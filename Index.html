<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />

  <title>一週天氣查詢</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #18212f;
      --muted: #6b7280;
      --accent: #2f6fed;
      --border: #e6ebf2;
      --shadow: 0 10px 30px rgba(22, 34, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    h1 {
      margin: 4px 0 14px;
      font-size: 28px;
      line-height: 1.2;
    }

    .search-box {
      display: flex;
      gap: 8px;

      position: sticky;
      top: 0;
      z-index: 10;

      padding: 10px 0 12px;

      background:
        linear-gradient(
          var(--bg) 80%,
          rgba(244, 247, 251, 0)
        );
    }

    input {
      flex: 1;
      min-width: 0;

      border: 1px solid var(--border);
      border-radius: 14px;

      padding: 14px 16px;

      font-size: 17px;

      background: #ffffff;

      outline: none;

      box-shadow:
        0 4px 14px rgba(22, 34, 51, 0.04);
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 14px;

      padding: 0 18px;

      font-size: 16px;
      font-weight: 700;

      color: #ffffff;
      background: var(--accent);

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin: 8px 2px 12px;

      color: var(--muted);

      font-size: 14px;

      min-height: 20px;
    }

    .place {
      margin: 10px 0 14px;

      padding: 16px;

      border-radius: 18px;

      background: var(--card);

      box-shadow: var(--shadow);
    }

    .place-name {
      font-size: 21px;
      font-weight: 800;
    }

    .place-detail {
      margin-top: 4px;

      color: var(--muted);

      font-size: 14px;
    }

    .forecast {
      display: grid;
      gap: 10px;
    }

    .day-card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 15px 16px;

      display: grid;
      grid-template-columns: 78px 56px 1fr;

      align-items: center;

      gap: 10px;

      box-shadow:
        0 5px 16px rgba(22, 34, 51, 0.04);
    }

    .date .weekday {
      font-weight: 800;
      font-size: 16px;
    }

    .date .md {
      color: var(--muted);

      font-size: 13px;

      margin-top: 3px;
    }

    .icon {
      text-align: center;
      font-size: 34px;
    }

    .weather-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .temp {
      font-size: 18px;
      font-weight: 800;
    }

    .details {
      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .recent {
      margin-top: 20px;
    }

    .recent h2 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: #ffffff;
      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 999px;

      padding: 8px 12px;

      font-size: 14px;

      cursor: pointer;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 25px;
      }

      .day-card {
        grid-template-columns: 70px 48px 1fr;
        padding: 14px;
      }

      button {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>🌤 一週天氣查詢</h1>

    <div class="search-box">

      <input
        id="placeInput"
        type="search"
        placeholder="輸入地點，例如：福岡、哈爾濱、台北"
        autocomplete="off"
      />

      <button id="searchBtn">
        搜尋
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      輸入城市或地點開始查詢。
    </div>


    <section
      id="placeCard"
      class="place"
      hidden
    >

      <div
        id="placeName"
        class="place-name"
      ></div>

      <div
        id="placeDetail"
        class="place-detail"
      ></div>

    </section>


    <section
      id="forecast"
      class="forecast"
    ></section>


    <section class="recent">

      <h2>
        最近搜尋
      </h2>

      <div
        id="recentList"
        class="recent-list"
      ></div>

    </section>

  </main>


  <script>

    const input =
      document.getElementById("placeInput");

    const searchBtn =
      document.getElementById("searchBtn");

    const statusEl =
      document.getElementById("status");

    const placeCard =
      document.getElementById("placeCard");

    const placeNameEl =
      document.getElementById("placeName");

    const placeDetailEl =
      document.getElementById("placeDetail");

    const forecastEl =
      document.getElementById("forecast");

    const recentListEl =
      document.getElementById("recentList");


    const weatherMap = {

      0: ["晴朗", "☀️"],

      1: ["大致晴朗", "🌤️"],

      2: ["局部多雲", "⛅"],

      3: ["陰天", "☁️"],

      45: ["有霧", "🌫️"],

      48: ["霧凇", "🌫️"],

      51: ["小毛毛雨", "🌦️"],

      53: ["毛毛雨", "🌦️"],

      55: ["較強毛毛雨", "🌧️"],

      56: ["凍毛毛雨", "🌧️"],

      57: ["強凍毛毛雨", "🌧️"],

      61: ["小雨", "🌦️"],

      63: ["中雨", "🌧️"],

      65: ["大雨", "🌧️"],

      66: ["凍雨", "🌧️"],

      67: ["強凍雨", "🌧️"],

      71: ["小雪", "🌨️"],

      73: ["中雪", "🌨️"],

      75: ["大雪", "❄️"],

      77: ["雪粒", "❄️"],

      80: ["陣雨", "🌦️"],

      81: ["較強陣雨", "🌧️"],

      82: ["強陣雨", "⛈️"],

      85: ["陣雪", "🌨️"],

      86: ["強陣雪", "❄️"],

      95: ["雷雨", "⛈️"],

      96: ["雷雨伴小冰雹", "⛈️"],

      99: ["雷雨伴冰雹", "⛈️"]

    };


    function formatDate(dateStr) {

      const d =
        new Date(dateStr + "T00:00:00");

      const weekdays = [
        "週日",
        "週一",
        "週二",
        "週三",
        "週四",
        "週五",
        "週六"
      ];

      return {

        weekday:
          weekdays[d.getDay()],

        md:
          `${d.getMonth() + 1}/${d.getDate()}`

      };

    }


    function saveRecent(name) {

      const old =
        JSON.parse(
          localStorage.getItem("weather_recent") || "[]"
        );

      const list = [

        name,

        ...old.filter(
          x => x !== name
        )

      ].slice(0, 6);


      localStorage.setItem(
        "weather_recent",
        JSON.stringify(list)
      );

      renderRecent();

    }


    function renderRecent() {

      const list =
        JSON.parse(
          localStorage.getItem("weather_recent") || "[]"
        );


      recentListEl.innerHTML = "";


      if (!list.length) {

        recentListEl.innerHTML =
          '<span class="status">尚無搜尋紀錄</span>';

        return;

      }


      for (const name of list) {

        const btn =
          document.createElement("button");

        btn.className = "chip";

        btn.textContent = name;


        btn.addEventListener(
          "click",
          () => {

            input.value = name;

            searchWeather();

          }
        );


        recentListEl.appendChild(btn);

      }

    }


    async function geocode(place) {

      const url =
        new URL(
          "https://geocoding-api.open-meteo.com/v1/search"
        );


      url.searchParams.set(
        "name",
        place
      );

      url.searchParams.set(
        "count",
        "1"
      );

      url.searchParams.set(
        "language",
        "zh"
      );

      url.searchParams.set(
        "format",
        "json"
      );


      const res =
        await fetch(url);


      if (!res.ok) {

        throw new Error(
          "地點搜尋失敗"
        );

      }


      const data =
        await res.json();


      if (
        !data.results ||
        !data.results.length
      ) {

        throw new Error(
          "找不到這個地點，請換個名稱再試一次"
        );

      }


      return data.results[0];

    }


    async function fetchForecast(
      lat,
      lon
    ) {

      const url =
        new URL(
          "https://api.open-meteo.com/v1/forecast"
        );


      url.searchParams.set(
        "latitude",
        lat
      );

      url.searchParams.set(
        "longitude",
        lon
      );


      url.searchParams.set(

        "daily",

        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min," +
        "precipitation_sum," +
        "precipitation_probability_max," +
        "wind_speed_10m_max"

      );


      url.searchParams.set(
        "timezone",
        "auto"
      );


      url.searchParams.set(
        "forecast_days",
        "7"
      );


      const res =
        await fetch(url);


      if (!res.ok) {

        throw new Error(
          "天氣資料取得失敗"
        );

      }


      return await res.json();

    }


    function renderForecast(
      location,
      data
    ) {

      placeCard.hidden = false;


      placeNameEl.textContent =
        location.name;


      const parts = [

        location.admin1,

        location.country

      ].filter(Boolean);


      placeDetailEl.textContent =
        parts.join("・");


      forecastEl.innerHTML = "";


      const d =
        data.daily;


      for (
        let i = 0;
        i < d.time.length;
        i++
      ) {

        const date =
          formatDate(
            d.time[i]
          );


        const weather =
          weatherMap[
            d.weather_code[i]
          ] || [
            "未知",
            "🌡️"
          ];


        const desc =
          weather[0];


        const icon =
          weather[1];


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "day-card";


        card.innerHTML = `

          <div class="date">

            <div class="weekday">

              ${
                i === 0
                ? "今天"
                : date.weekday
              }

            </div>

            <div class="md">

              ${date.md}

            </div>

          </div>


          <div class="icon">

            ${icon}

          </div>


          <div>

            <div class="weather-title">

              ${desc}

            </div>


            <div class="temp">

              ${
                Math.round(
                  d.temperature_2m_max[i]
                )
              }°

              /

              ${
                Math.round(
                  d.temperature_2m_min[i]
                )
              }°

            </div>


            <div class="details">

              降雨
              ${
                d.precipitation_probability_max[i]
                ?? "-"
              }%

              ・雨量
              ${
                d.precipitation_sum[i]
                ?? "-"
              }
              mm

              ・風速
              ${
                Math.round(
                  d.wind_speed_10m_max[i]
                  ?? 0
                )
              }
              km/h

            </div>

          </div>

        `;


        forecastEl.appendChild(
          card
        );

      }

    }


    async function searchWeather() {

      const place =
        input.value.trim();


      if (!place) {

        statusEl.textContent =
          "請先輸入地點。";

        return;

      }


      searchBtn.disabled =
        true;


      statusEl.textContent =
        "正在搜尋地點與天氣…";


      forecastEl.innerHTML =
        "";


      placeCard.hidden =
        true;


      try {

        const location =
          await geocode(
            place
          );


        const weather =
          await fetchForecast(

            location.latitude,

            location.longitude

          );


        renderForecast(

          location,

          weather

        );


        statusEl.textContent =
          "已更新未來 7 天天氣。";


        saveRecent(
          location.name
        );

      }

      catch (err) {

        console.error(
          err
        );


        statusEl.textContent =
          err.message ||
          "發生錯誤，請稍後再試。";

      }

      finally {

        searchBtn.disabled =
          false;

      }

    }


    searchBtn.addEventListener(

      "click",

      searchWeather

    );


    input.addEventListener(

      "keydown",

      event => {

        if (
          event.key === "Enter"
        ) {

          searchWeather();

        }

      }

    );


    renderRecent();

  </script>

</body>
</html>
