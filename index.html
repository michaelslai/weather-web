<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>一週天氣查詢 V1.1</title>

<style>
:root{
--bg:#f4f7fb;
--card:#fff;
--text:#18212f;
--muted:#6b7280;
--accent:#2f6fed;
--border:#e6ebf2;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Noto Sans TC",
"Microsoft JhengHei",
sans-serif;
background:var(--bg);
color:var(--text);
}

.app{
width:min(100%,760px);
margin:auto;
padding:18px 14px 36px;
}

h1{
font-size:28px;
margin:4px 0 14px;
}

.search-box{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:8px;
position:sticky;
top:0;
background:var(--bg);
padding:10px 0 12px;
z-index:10;
}

select,
button{
border-radius:14px;
font-size:16px;
min-height:50px;
}

select{
border:1px solid var(--border);
padding:0 12px;
background:#fff;
color:var(--text);
}

button{
border:0;
padding:0 18px;
background:var(--accent);
color:#fff;
font-weight:700;
}

button:disabled{
opacity:.6;
}

.status{
margin:8px 2px 12px;
color:var(--muted);
font-size:14px;
min-height:20px;
}

.place{
background:#fff;
border-radius:18px;
padding:16px;
margin:10px 0 14px;
box-shadow:0 10px 30px rgba(22,34,51,.08);
}

.place-name{
font-size:21px;
font-weight:800;
}

.place-detail{
margin-top:4px;
color:var(--muted);
font-size:14px;
}

.forecast{
display:grid;
gap:10px;
}

.day-card{
background:#fff;
border:1px solid var(--border);
border-radius:18px;
padding:15px 16px;
display:grid;
grid-template-columns:78px 56px 1fr;
align-items:center;
gap:10px;
}

.weekday{
font-weight:800;
}

.md,
.details{
color:var(--muted);
font-size:13px;
}

.md{
margin-top:3px;
}

.icon{
text-align:center;
font-size:34px;
}

.weather-title{
font-weight:800;
margin-bottom:6px;
}

.temp{
font-size:18px;
font-weight:800;
}

.details{
margin-top:6px;
line-height:1.6;
}

@media(max-width:560px){

h1{
font-size:25px;
}

.search-box{
grid-template-columns:1fr 1fr;
}

.search-box button{
grid-column:1 / -1;
}

.day-card{
grid-template-columns:70px 48px 1fr;
padding:14px;
}

}
</style>
</head>

<body>

<main class="app">

<h1>🌤 一週天氣查詢</h1>

<div class="search-box">

<select id="countrySelect">
<option value="">請選擇國家</option>
<option value="china">中國</option>
<option value="taiwan">台灣</option>
<option value="japan">日本</option>
</select>

<select id="placeSelect" disabled>
<option value="">請先選擇國家</option>
</select>

<button id="searchBtn">
查詢天氣
</button>

</div>

<div id="status" class="status">
請先選擇國家與地點。
</div>

<section id="placeCard" class="place" hidden>

<div id="placeName" class="place-name"></div>

<div id="placeDetail" class="place-detail"></div>

</section>

<section id="forecast" class="forecast"></section>

</main>

<script>

const countrySelect =
document.getElementById("countrySelect");

const placeSelect =
document.getElementById("placeSelect");

const searchBtn =
document.getElementById("searchBtn");

const statusEl =
document.getElementById("status");

const placeCard =
document.getElementById("placeCard");

const placeNameEl =
document.getElementById("placeName");

const placeDetailEl =
document.getElementById("placeDetail");

const forecastEl =
document.getElementById("forecast");


const countryNames = {
china: "中國",
taiwan: "台灣",
japan: "日本"
};


const placeData = {

china: [

{
name: "哈爾濱",
latitude: 45.8038,
longitude: 126.5349
},

{
name: "橫道河子",
latitude: 44.8167,
longitude: 129.0667
},

{
name: "鏡泊湖",
latitude: 43.8500,
longitude: 128.9500
},

{
name: "長白山",
latitude: 42.0060,
longitude: 128.0550
}

],


taiwan: [

{
name: "台北",
latitude: 25.0330,
longitude: 121.5654
},

{
name: "基隆",
latitude: 25.1276,
longitude: 121.7392
},

{
name: "桃園",
latitude: 24.9937,
longitude: 121.3010
},

{
name: "新竹",
latitude: 24.8138,
longitude: 120.9675
},

{
name: "台中",
latitude: 24.1477,
longitude: 120.6736
},

{
name: "台南",
latitude: 22.9999,
longitude: 120.2269
},

{
name: "高雄",
latitude: 22.6273,
longitude: 120.3014
},

{
name: "宜蘭",
latitude: 24.7570,
longitude: 121.7530
},

{
name: "花蓮",
latitude: 23.9911,
longitude: 121.6112
},

{
name: "台東",
latitude: 22.7554,
longitude: 121.1500
}

],


japan: [

{
name: "福岡",
latitude: 33.5902,
longitude: 130.4017
},

{
name: "熊本",
latitude: 32.8031,
longitude: 130.7079
},

{
name: "別府",
latitude: 33.2846,
longitude: 131.4912
},

{
name: "東京",
latitude: 35.6762,
longitude: 139.6503
},

{
name: "大阪",
latitude: 34.6937,
longitude: 135.5023
},

{
name: "京都",
latitude: 35.0116,
longitude: 135.7681
},

{
name: "札幌",
latitude: 43.0618,
longitude: 141.3545
},

{
name: "那霸（沖繩）",
latitude: 26.2124,
longitude: 127.6809
}

]

};


const weatherMap = {

0: ["晴朗", "☀️"],

1: ["大致晴朗", "🌤️"],

2: ["局部多雲", "⛅"],

3: ["陰天", "☁️"],

45: ["有霧", "🌫️"],

48: ["霧凇", "🌫️"],

51: ["小毛毛雨", "🌦️"],

53: ["毛毛雨", "🌦️"],

55: ["較強毛毛雨", "🌧️"],

56: ["凍毛毛雨", "🌧️"],

57: ["強凍毛毛雨", "🌧️"],

61: ["小雨", "🌦️"],

63: ["中雨", "🌧️"],

65: ["大雨", "🌧️"],

66: ["凍雨", "🌧️"],

67: ["強凍雨", "🌧️"],

71: ["小雪", "🌨️"],

73: ["中雪", "🌨️"],

75: ["大雪", "❄️"],

77: ["雪粒", "❄️"],

80: ["陣雨", "🌦️"],

81: ["較強陣雨", "🌧️"],

82: ["強陣雨", "⛈️"],

85: ["陣雪", "🌨️"],

86: ["強陣雪", "❄️"],

95: ["雷雨", "⛈️"],

96: ["雷雨伴小冰雹", "⛈️"],

99: ["雷雨伴冰雹", "⛈️"]

};


countrySelect.addEventListener(
"change",
() => {

const country =
countrySelect.value;


placeSelect.innerHTML =
"";


if (!country) {

placeSelect.disabled =
true;

placeSelect.innerHTML =
'<option value="">請先選擇國家</option>';

statusEl.textContent =
"請先選擇國家與地點。";

return;

}


placeSelect.disabled =
false;


placeSelect.innerHTML =
'<option value="">請選擇地點</option>';


placeData[country].forEach(
(place, index) => {

const option =
document.createElement(
"option"
);


option.value =
index;


option.textContent =
place.name;


placeSelect.appendChild(
option
);

}
);


statusEl.textContent =
`已選擇${countryNames[country]}，請再選擇地點。`;

}
);


function formatDate(dateStr) {

const d =
new Date(
dateStr + "T00:00:00"
);


const weekdays = [
"週日",
"週一",
"週二",
"週三",
"週四",
"週五",
"週六"
];


return {

weekday:
weekdays[d.getDay()],

md:
`${d.getMonth() + 1}/${d.getDate()}`

};

}


async function fetchForecast(
lat,
lon
) {

const url =
new URL(
"https://api.open-meteo.com/v1/forecast"
);


url.searchParams.set(
"latitude",
lat
);


url.searchParams.set(
"longitude",
lon
);


url.searchParams.set(

"daily",

"weather_code," +
"temperature_2m_max," +
"temperature_2m_min," +
"precipitation_sum," +
"precipitation_probability_max," +
"wind_speed_10m_max"

);


url.searchParams.set(
"timezone",
"auto"
);


url.searchParams.set(
"forecast_days",
"7"
);


const response =
await fetch(url);


if (!response.ok) {

throw new Error(
"天氣資料取得失敗"
);

}


return await response.json();

}


function renderForecast(
location,
country,
data
) {

placeCard.hidden =
false;


placeNameEl.textContent =
location.name;


placeDetailEl.textContent =
`${countryNames[country]}・` +
`${location.latitude.toFixed(4)}, ` +
`${location.longitude.toFixed(4)}`;


forecastEl.innerHTML =
"";


const daily =
data.daily;


for (
let i = 0;
i < daily.time.length;
i++
) {

const date =
formatDate(
daily.time[i]
);


const weather =
weatherMap[
daily.weather_code[i]
] || [
"未知",
"🌡️"
];


const desc =
weather[0];


const icon =
weather[1];


const card =
document.createElement(
"article"
);


card.className =
"day-card";


card.innerHTML = `

<div>

<div class="weekday">

${
i === 0
? "今天"
: date.weekday
}

</div>

<div class="md">

${date.md}

</div>

</div>


<div class="icon">

${icon}

</div>


<div>

<div class="weather-title">

${desc}

</div>


<div class="temp">

${
Math.round(
daily.temperature_2m_max[i]
)
}°

/

${
Math.round(
daily.temperature_2m_min[i]
)
}°

</div>


<div class="details">

降雨
${
daily.precipitation_probability_max[i]
?? "-"
}%

・雨量
${
daily.precipitation_sum[i]
?? "-"
}
mm

・風速
${
Math.round(
daily.wind_speed_10m_max[i]
?? 0
)
}
km/h

</div>

</div>

`;


forecastEl.appendChild(
card
);

}

}


searchBtn.addEventListener(
"click",

async () => {

const country =
countrySelect.value;


const placeIndex =
placeSelect.value;


if (!country) {

statusEl.textContent =
"請先選擇國家。";

return;

}


if (placeIndex === "") {

statusEl.textContent =
"請選擇地點。";

return;

}


const location =
placeData[country][
Number(placeIndex)
];


searchBtn.disabled =
true;


forecastEl.innerHTML =
"";


placeCard.hidden =
true;


statusEl.textContent =
"正在取得天氣資料…";


try {

const weather =
await fetchForecast(

location.latitude,

location.longitude

);


renderForecast(

location,

country,

weather

);


statusEl.textContent =
"已更新未來 7 天天氣。";

}

catch (error) {

console.error(
error
);


statusEl.textContent =
error.message ||
"發生錯誤，請稍後再試。";

}

finally {

searchBtn.disabled =
false;

}

}
);

</script>

</body>
</html>
