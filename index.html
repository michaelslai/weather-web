<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#f4f7fb">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>一週天氣查詢 V1.2</title>

<style>

:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #18212f;
  --muted: #6b7280;
  --accent: #2f6fed;
  --border: #e6ebf2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

.app {
  width: min(100%, 760px);

  margin: auto;

  padding:
    18px
    14px
    calc(36px + env(safe-area-inset-bottom));
}

h1 {
  margin: 4px 0 6px;
  font-size: 28px;
}

.subtitle {
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 14px;
}

.search-panel {
  position: sticky;
  top: 0;
  z-index: 10;

  padding: 10px 0 12px;

  background:
    linear-gradient(
      var(--bg) 88%,
      rgba(244,247,251,0)
    );
}

.search-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

select,
button {
  min-height: 50px;
  border-radius: 14px;
  font-size: 16px;
}

select {
  width: 100%;
  min-width: 0;

  padding: 0 12px;

  border: 1px solid var(--border);

  background: #ffffff;
  color: var(--text);

  outline: none;
}

select:focus {
  border-color: var(--accent);
}

select:disabled {
  color: #9ca3af;
  background: #f0f2f5;
}

button {
  border: 0;
  padding: 0 18px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.search-button {
  grid-column: 1 / -1;
  background: var(--accent);
  color: #ffffff;
}

.location-button {
  width: 100%;
  margin-top: 8px;

  border: 1px solid var(--accent);

  background: #ffffff;
  color: var(--accent);
}

.status {
  min-height: 20px;

  margin:
    8px
    2px
    12px;

  color: var(--muted);
  font-size: 14px;
}

.place {
  margin:
    10px
    0
    14px;

  padding: 16px;

  border-radius: 18px;

  background: var(--card);

  box-shadow:
    0
    10px
    30px
    rgba(22,34,51,.08);
}

.place-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.place-name {
  font-size: 22px;
  font-weight: 800;
}

.place-badge {
  padding:
    5px
    9px;

  border-radius: 999px;

  background: #edf3ff;
  color: var(--accent);

  font-size: 12px;
  font-weight: 700;
}

.place-detail {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.forecast {
  display: grid;
  gap: 10px;
}

.day-card {
  display: grid;

  grid-template-columns:
    72px
    54px
    1fr;

  align-items: center;

  gap: 10px;

  padding:
    15px
    16px;

  border:
    1px solid
    var(--border);

  border-radius: 18px;

  background:
    var(--card);

  box-shadow:
    0
    5px
    16px
    rgba(22,34,51,.04);
}

.today-card {
  border:
    1px solid
    #bfd3ff;

  box-shadow:
    0
    8px
    22px
    rgba(47,111,237,.10);
}

.weekday {
  font-size: 16px;
  font-weight: 800;
}

.md {
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
}

.icon {
  text-align: center;
  font-size: 34px;
}

.weather-title {
  margin-bottom: 5px;
  font-weight: 800;
}

.temp {
  font-size: 19px;
  font-weight: 800;
}

.details {
  margin-top: 6px;

  color: var(--muted);

  font-size: 13px;

  line-height: 1.6;
}

@media (max-width: 560px) {

  h1 {
    font-size: 25px;
  }

  .day-card {
    grid-template-columns:
      65px
      46px
      1fr;

    padding: 14px;
  }

  .icon {
    font-size: 31px;
  }

}

</style>
</head>


<body>

<main class="app">

  <h1>
    🌤 一週天氣查詢
  </h1>

  <div class="subtitle">
    選擇地點，或使用手機目前位置查詢
  </div>


  <div class="search-panel">

    <div class="search-box">

      <select
        id="countrySelect"
        autocomplete="off"
      >

        <option value="">
          請選擇國家
        </option>

        <option value="china">
          中國
        </option>

        <option value="taiwan">
          台灣
        </option>

        <option value="japan">
          日本
        </option>

      </select>


      <select
        id="placeSelect"
        autocomplete="off"
        disabled
      >

        <option value="">
          請先選擇國家
        </option>

      </select>


      <button
        id="searchBtn"
        class="search-button"
      >

        查詢天氣

      </button>

    </div>


    <button
      id="locationBtn"
      class="location-button"
    >

      📍 使用目前位置

    </button>

  </div>


  <div
    id="status"
    class="status"
  >

    請選擇國家與地點，
    或使用目前位置。

  </div>


  <section
    id="placeCard"
    class="place"
    hidden
  >

    <div class="place-top">

      <div
        id="placeName"
        class="place-name"
      ></div>

      <div
        id="placeBadge"
        class="place-badge"
      ></div>

    </div>


    <div
      id="placeDetail"
      class="place-detail"
    ></div>

  </section>


  <section
    id="forecast"
    class="forecast"
  ></section>

</main>


<script>

/* =========================
   DOM
========================= */

const countrySelect =
  document.getElementById(
    "countrySelect"
  );

const placeSelect =
  document.getElementById(
    "placeSelect"
  );

const searchBtn =
  document.getElementById(
    "searchBtn"
  );

const locationBtn =
  document.getElementById(
    "locationBtn"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const placeCard =
  document.getElementById(
    "placeCard"
  );

const placeNameEl =
  document.getElementById(
    "placeName"
  );

const placeDetailEl =
  document.getElementById(
    "placeDetail"
  );

const placeBadgeEl =
  document.getElementById(
    "placeBadge"
  );

const forecastEl =
  document.getElementById(
    "forecast"
  );


/* =========================
   國家名稱
========================= */

const countryNames = {

  taiwan: "台灣",

  japan: "日本"

};


/* =========================

========================= */

const placeData = {

    },

    {

    },

    {

    },

    {

    },

    {

    }

  ],


  taiwan: [

    {

      longitude: 121.5654
    },

    {

      latitude: 25.1276,

    },

    {

    },

    {

    },

    {

      latitude: 24.1477,

    },

    {

      latitude: 22.9999,

    },

    {

      latitude: 22.6273,
      longitude: 120.3014
    },

    {
      name: "宜蘭",
      latitude: 24.7570,
      longitude: 121.7530
    },

    {
      name: "花蓮",
      latitude: 23.9911,
      longitude: 121.6112
    },

    {
      name: "台東",
      latitude: 22.7554,
      longitude: 121.1500
    }

  ],


  japan: [

    {
      name: "福岡",
      latitude: 33.5902,

    },

    {

    },

    {

      latitude: 33.2846,

    },

    {

      latitude: 35.6762,

    },

    {
      name: "大阪",
      latitude: 34.6937,
      longitude: 135.5023
    },

    {
      name: "京都",
      latitude: 35.0116,

    },

    {
      name: "札幌",
      latitude: 43.0618,
      longitude: 141.3545
    },

    {
      name: "那霸（沖繩）",
      latitude: 26.2124,
      longitude: 127.6809
    }

  ]

};


/* =========================
   天氣代碼
========================= */

const weatherMap = {

  0: ["晴朗", "☀️"],

  1: ["大致晴朗", "🌤️"],

  2: ["局部多雲", "⛅"],

  3: ["陰天", "☁️"],

  45: ["有霧", "🌫️"],

  48: ["霧凇", "🌫️"],

  51: ["小毛毛雨", "🌦️"],

  53: ["毛毛雨", "🌦️"],

  55: ["較強毛毛雨", "🌧️"],

  56: ["凍毛毛雨", "🌧️"],

  57: ["強凍毛毛雨", "🌧️"],

  61: ["小雨", "🌦️"],

  63: ["中雨", "🌧️"],

  65: ["大雨", "🌧️"],

  66: ["凍雨", "🌧️"],

  67: ["強凍雨", "🌧️"],

  71: ["小雪", "🌨️"],

  73: ["中雪", "🌨️"],

  75: ["大雪", "❄️"],

  77: ["雪粒", "❄️"],

  80: ["陣雨", "🌦️"],

  81: ["較強陣雨", "🌧️"],

  82: ["強陣雨", "⛈️"],

  85: ["陣雪", "🌨️"],

  86: ["強陣雪", "❄️"],

  95: ["雷雨", "⛈️"],

  96: ["雷雨伴小冰雹", "⛈️"],

  99: ["雷雨伴冰雹", "⛈️"]

};


/* =========================
   更新地點選單
========================= */

function updatePlaceList() {

  const country =
    countrySelect.value;


  placeSelect.innerHTML =
    "";


  if (!country) {

    placeSelect.disabled =
      true;


    placeSelect.innerHTML =
      `
      <option value="">
        請先選擇國家
      </option>
      `;


    statusEl.textContent =
      "請選擇國家與地點，或使用目前位置。";


    return;

  }


  placeSelect.disabled =
    false;


  placeSelect.innerHTML =
    `
    <option value="">
      請選擇地點
    </option>
    `;


  placeData[country].forEach(

    (place, index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        place.name;


      placeSelect.appendChild(
        option
      );

    }

  );


  statusEl.textContent =
    `已選擇${countryNames[country]}，請選擇地點。`;

}


countrySelect.addEventListener(

  "change",

  updatePlaceList

);


updatePlaceList();


/* =========================
   日期格式
========================= */

function formatDate(
  dateStr
) {

  const date =
    new Date(
      dateStr + "T00:00:00"
    );


  const weekdays = [

    "週日",
    "週一",
    "週二",
    "週三",
    "週四",
    "週五",
    "週六"

  ];


  return {

    weekday:
      weekdays[
        date.getDay()
      ],

    md:
      `${date.getMonth() + 1}/${date.getDate()}`

  };

}


/* =========================
   天氣 API
========================= */

async function fetchForecast(
  lat,
  lon
) {

  const url =
    new URL(
      "https://api.open-meteo.com/v1/forecast"
    );


  url.searchParams.set(
    "latitude",
    lat
  );


  url.searchParams.set(
    "longitude",
    lon
  );


  url.searchParams.set(

    "daily",

    [
      "weather_code",
      "temperature_2m_max",
      "temperature_2m_min",
      "precipitation_sum",
      "precipitation_probability_max",
      "wind_speed_10m_max"
    ].join(",")

  );


  url.searchParams.set(
    "timezone",
    "auto"
  );


  url.searchParams.set(
    "forecast_days",
    "7"
  );


  const response =
    await fetch(
      url
    );


  if (!response.ok) {

    throw new Error(
      "天氣資料取得失敗"
    );

  }


  return await response.json();

}


/* =========================
   GPS 反查地名
========================= */

async function reverseGeocode(
  lat,
  lon
) {

  try {

    const url =
      new URL(
        "https://api.bigdatacloud.net/data/reverse-geocode-client"
      );


    url.searchParams.set(
      "latitude",
      lat
    );


    url.searchParams.set(
      "longitude",
      lon
    );


    url.searchParams.set(
      "localityLanguage",
      "zh"
    );


    const response =
      await fetch(
        url
      );


    if (!response.ok) {

      throw new Error(
        "反查地名失敗"
      );

    }


    const data =
      await response.json();


    const city =
      data.city ||
      data.locality ||
      data.principalSubdivision ||
      "目前位置";


    return {

      city:
        city,

      region:
        data.principalSubdivision || "",

      country:
        data.countryName || ""

    };

  }

  catch (error) {

    console.warn(
      "Reverse geocoding failed:",
      error
    );


    return {

      city: "目前位置",

      region: "",

      country: ""

    };

  }

}


/* =========================
   顯示天氣
========================= */

function renderForecast(
  location,
  sourceName,
  data
) {

  placeCard.hidden =
    false;


  placeNameEl.textContent =
    location.name;


  placeBadgeEl.textContent =
    sourceName;


  let detailText =
    "";


  if (
    location.region ||
    location.country
  ) {

    detailText = [

      location.region,

      location.country

    ]
    .filter(Boolean)
    .join("・");

  }


  const coordinateText =
    `${location.latitude.toFixed(4)}, ${location.longitude.toFixed(4)}`;


  if (detailText) {

    placeDetailEl.textContent =
      `${detailText}・${coordinateText}`;

  }

  else {

    placeDetailEl.textContent =
      coordinateText;

  }


  forecastEl.innerHTML =
    "";


  const daily =
    data.daily;


  for (
    let i = 0;
    i < daily.time.length;
    i++
  ) {

    const date =
      formatDate(
        daily.time[i]
      );


    const weather =
      weatherMap[
        daily.weather_code[i]
      ] || [
        "未知",
        "🌡️"
      ];


    const description =
      weather[0];


    const icon =
      weather[1];


    const highTemp =
      Math.round(
        daily.temperature_2m_max[i]
      );


    const lowTemp =
      Math.round(
        daily.temperature_2m_min[i]
      );


    const rainChance =
      daily.precipitation_probability_max[i]
      ?? "-";


    const rainAmount =
      daily.precipitation_sum[i]
      ?? "-";


    const windSpeed =
      Math.round(
        daily.wind_speed_10m_max[i]
        ?? 0
      );


    const card =
      document.createElement(
        "article"
      );


    card.className =
      i === 0
      ? "day-card today-card"
      : "day-card";


    card.innerHTML = `

      <div>

        <div class="weekday">

          ${
            i === 0
            ? "今天"
            : date.weekday
          }

        </div>


        <div class="md">

          ${date.md}

        </div>

      </div>


      <div class="icon">

        ${icon}

      </div>


      <div>

        <div class="weather-title">

          ${description}

        </div>


        <div class="temp">

          ${highTemp}°
          /
          ${lowTemp}°

        </div>


        <div class="details">

          ☔ 降雨 ${rainChance}%

          ・雨量 ${rainAmount} mm

          <br>

          💨 最大風速 ${windSpeed} km/h

        </div>

      </div>

    `;


    forecastEl.appendChild(
      card
    );

  }

}


/* =========================
   固定地點查詢
========================= */

searchBtn.addEventListener(

  "click",

  async () => {

    const country =
      countrySelect.value;


    const placeIndex =
      placeSelect.value;


    if (!country) {

      statusEl.textContent =
        "請先選擇國家。";

      return;

    }


    if (placeIndex === "") {

      statusEl.textContent =
        "請選擇地點。";

      return;

    }


    const location =
      placeData[country][
        Number(placeIndex)
      ];


    searchBtn.disabled =
      true;


    locationBtn.disabled =
      true;


    forecastEl.innerHTML =
      "";


    placeCard.hidden =
      true;


    statusEl.textContent =
      "正在取得天氣資料…";


    try {

      const weather =
        await fetchForecast(

          location.latitude,

          location.longitude

        );


      renderForecast(

        {

          ...location,

          region:
            countryNames[country],

          country:
            ""

        },

        "指定地點",

        weather

      );


      statusEl.textContent =
        "已更新未來 7 天天氣。";

    }

    catch (error) {

      console.error(
        error
      );


      statusEl.textContent =
        error.message ||
        "取得天氣資料失敗。";

    }

    finally {

      searchBtn.disabled =
        false;


      locationBtn.disabled =
        false;

    }

  }

);


/* =========================
   手機 GPS
========================= */

locationBtn.addEventListener(

  "click",

  () => {


    if (
      !navigator.geolocation
    ) {

      statusEl.textContent =
        "此瀏覽器不支援定位功能。";

      return;

    }


    locationBtn.disabled =
      true;


    searchBtn.disabled =
      true;


    statusEl.textContent =
      "📍 正在取得目前位置…";


    navigator.geolocation.getCurrentPosition(


      async position => {

        const lat =
          position.coords.latitude;


        const lon =
          position.coords.longitude;


        const accuracy =
          position.coords.accuracy;


        statusEl.textContent =
          "已取得位置，正在取得地名與天氣…";


        try {


          const [
            weather,
            placeInfo
          ] =

          await Promise.all([

            fetchForecast(
              lat,
              lon
            ),

            reverseGeocode(
              lat,
              lon
            )

          ]);


          renderForecast(

            {

              name:
                placeInfo.city,

              region:
                placeInfo.region,

              country:
                placeInfo.country,

              latitude:
                lat,

              longitude:
                lon

            },

            "📍 目前位置",

            weather

          );


          statusEl.textContent =
            `定位成功・GPS 精度約 ${Math.round(accuracy)} 公尺`;


        }

        catch (error) {

          console.error(
            error
          );


          statusEl.textContent =
            "定位成功，但無法取得天氣資料。";

        }

        finally {

          locationBtn.disabled =
            false;


          searchBtn.disabled =
            false;

        }

      },


      error => {


        locationBtn.disabled =
          false;


        searchBtn.disabled =
          false;


        switch (
          error.code
        ) {


          case error.PERMISSION_DENIED:

            statusEl.textContent =
              "你沒有允許網站使用定位。請在瀏覽器設定中開啟定位權限。";

            break;


          case error.POSITION_UNAVAILABLE:

            statusEl.textContent =
              "目前無法取得 GPS 位置，請稍後再試。";

            break;


          case error.TIMEOUT:

            statusEl.textContent =
              "定位逾時，請再試一次。";

            break;


          default:

            statusEl.textContent =
              "無法取得目前位置。";

        }

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          300000

      }

    );

  }

);

</script>

</body>
</html>
